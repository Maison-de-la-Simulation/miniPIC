# _____________________________________________________________________________
#
# GitLab CI for miniPIC
# _____________________________________________________________________________

# image: gcc

variables:
  # List of GPUs to exclude from the tests
  EXCLUDED_GPUS: "ruche-gpu16"
  # List of benchmarks to run
  BENCHMARKS_CPU_ALL: "default,beam,antenna,Ecst,Bcst"
  BENCHMARKS_GPU_ALL: "default_gpu,beam_gpu,antenna"
  BENCHMARKS_CPU_SHORT: "default"
  BENCHMARKS_GPU_SHORT: "default_gpu"

.default_run: &default_run [master, nvidia_profiling, update_kokkos]

# _____________________________________________________________________________
#
# Workflow
# _____________________________________________________________________________
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Run the CI if the commit message contains `[run ci]`
    - if: $CI_COMMIT_MESSAGE =~ /\[run ci\]/
      variables:
        BENCHMARKS_CPU: $BENCHMARKS_CPU_SHORT
        BENCHMARKS_GPU: $BENCHMARKS_GPU_SHORT
      when: always
    # Do not run the CI if the commit message
    # contains `[skip ci]` or contains `draft`
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/ || $CI_COMMIT_REF_NAME =~ /\[draft\]/
      when: never 
    # For branches in default_run, run the CI
    - if: $CI_COMMIT_BRANCH =~ /size_t_particles|nvidia_blackwell/
      variables:
        BENCHMARKS_CPU: $BENCHMARKS_CPU_SHORT
        BENCHMARKS_GPU: $BENCHMARKS_GPU_SHORT
      when: always
    - if: $CI_COMMIT_BRANCH =~ /master|develop|fix_interpolation/
      variables:
        BENCHMARKS_CPU: $BENCHMARKS_CPU_ALL
        BENCHMARKS_GPU: $BENCHMARKS_GPU_ALL
      when: always
    # Run CI whern a merge request is created
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        BENCHMARKS_CPU: $BENCHMARKS_CPU_ALL
        BENCHMARKS_GPU: $BENCHMARKS_GPU_ALL
      when: always

