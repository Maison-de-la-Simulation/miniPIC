        - src/setups/*
        - src/main.cpp
        - .gitlab-ci.yml
        - tests/run.py
        - validation/*
        - CMakeLists.txt
      when: always
    # If has [run ci] in the commit message, always run the CI
    - if: $CI_COMMIT_MESSAGE =~ /\[run ci\]/
      when: always
    # Do not run if draft or skip ci
    - if: $CI_COMMIT_REF_NAME =~ /\[draft\]/ || $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    # If on the master branch, always run the CI
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
  tags:
    - ruche
  stage: test
  before_script:
    - source ${WORKDIR}/gitlab-ci_runs/env/openacc
  script:
    - cp -r tests tests_omp_target
    - cd tests_omp_target
    - srun --nodes=1 --time=00:10:00 -p gpua100 --gres=gpu:1 --exclude=$EXCLUDED_GPUS python3 run.py -g openmp_target --compile-only # --save-timers
