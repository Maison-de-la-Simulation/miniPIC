      changes:
        - src/thrust/*
        - src/common/*
        - src/setups/*
        - src/main.cpp
        - .gitlab-ci.yml
        - tests/run.py
        - validation/*
        - CMakeLists.txt
      when: always
    # If has [run ci] in the commit message, always run the CI
    - if: $CI_COMMIT_MESSAGE =~ /\[run ci\]/
      when: always
    # Do not run if draft or skip ci
    - if: $CI_COMMIT_REF_NAME =~ /\[draft\]/ || $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    # If on the master branch, always run the CI
    - if: $CI_COMMIT_BRANCH == "master"
      when: always
  tags:
    - ruche
  stage: test
  # needs: [ test_kokkos_omp ]
  before_script:
    #- source $WORKDIR/gitlab-ci_runs/env/kokkos_v100
    - source $WORKDIR/gitlab-ci_runs/env/kokkos_a100
  script:
    - cp -r tests tests_thrust_gpu
    - cd tests_thrust_gpu
    #- srun --nodes=1 --time=00:10:00 -p gpu --gres=gpu:1 python3 run.py -g thrust # --save-timers
    - srun --nodes=1 --time=00:10:00 -p gpua100 --exclude=$EXCLUDED_GPUS --gres=gpu:1 python3 run.py -g thrust_gpu --benchmarks=$BENCHMARKS_GPU
    - cd ..
    - cp -r tests tests_thrust_gpu_counting
    - cd tests_thrust_gpu_counting
    - srun --nodes=1 --time=00:10:00 -p gpua100 --exclude=$EXCLUDED_GPUS --gres=gpu:1 python3 run.py -g thrust_gpu --cmake-args="-DTHRUST_ITERATOR_TYPE=counting" --benchmarks=$BENCHMARKS_GPU
    - cd ..
    - cp -r tests tests_thrust_gpu_unified
    - cd tests_thrust_gpu_unified
    - srun --nodes=1 --time=00:10:00 -p gpua100 --exclude=$EXCLUDED_GPUS --gres=gpu:1 python3 run.py -g thrust_gpu --cmake-args="-DTHRUST_ITERATOR_TYPE=counting" --benchmarks=$BENCHMARKS_GPU --backend=thrust_unified

